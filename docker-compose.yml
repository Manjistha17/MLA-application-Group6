services:
  activity-tracking:
    build:
      context: ./activity-tracking
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
    ports:               # ← change here
      - "5300:5300"
    networks:
      - app-network

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
    ports:
      - "5050:5050"
    networks:
      - app-network

  authservice:
    build:
      context: ./authservice
      dockerfile: Dockerfile
    environment:
      - SPRING_DATA_MONGODB_DATABASE=mlagrp6db
      - SPRING_DATA_MONGODB_URI=${MONGO_URI}
    ports:
      - "8080:8080"
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "eu-north-1"        # change to your region
        awslogs-group: "authservice-logs"
        awslogs-stream: "authservice"
        awslogs-create-group: "true"

    networks:
      - app-network

  workout-api:
    build:
      context: ./workout-api
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
    ports:
      - "8000:8000"
    networks:
      - app-network

  group-api:
    build:
      context: ./group-api
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI}
    ports:
      - "8005:8005"
    networks:
      - app-network

  nutrition-api:
    build: ./nutrition-api
    environment:
      - MONGO_URI=${MONGO_URI}
    ports:
      - "5005:5005"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
