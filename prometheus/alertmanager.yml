global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_auth_username: 'sagarikabohidar94@gmail.com'
  smtp_auth_password: 'xxxxxxxxx'
  smtp_require_tls: true
  smtp_from: 'sagarikabohidar94@gmail.com'

route:
  receiver: 'email-notification'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: 'email-notification'
      continue: true
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'email-notification'
      repeat_interval: 6h
    - match:
        severity: info
      receiver: 'email-notification'
      repeat_interval: 24h

receivers:
  - name: 'email-notification'
    email_configs:
      - to: 'sagarikabohidar94@gmail.com'
        from: 'sagarikabohidar94@gmail.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'sagarikabohidar94@gmail.com'
        auth_password: 'xxxxxxxx'
        require_tls: true
        headers:
          Subject: '[{{ .GroupLabels.severity | toUpper }}] {{ .GroupLabels.alertname }}'
        html: |
          {{ range .Alerts }}
            <h3>Alert: {{ .Labels.alertname }}</h3>
            <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
            <p><strong>Service:</strong> {{ .Labels.job }}</p>
            <p><strong>Description:</strong> {{ .Annotations.description }}</p>
            <p><strong>Value:</strong> {{ .Annotations.value }}</p>
            <p><strong>Time:</strong> {{ .StartsAt }}</p>
            <a href="{{ .GeneratorURL }}">View in Prometheus</a>
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
